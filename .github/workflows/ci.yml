name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forever
          POSTGRES_PASSWORD: forever
          POSTGRES_DB: forever_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forever" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://forever:forever@localhost:5432/forever_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Tests de l'addon (Lua 5.1, la version du jeu)
        run: |
          sudo apt-get install -y -qq lua5.1 > /dev/null
          for f in addon/ForeverRoster/*.lua; do luac5.1 -p "$f"; done
          lua5.1 addon/tests/format_test.lua
          git diff --exit-code addon/tests/sample.frc
      - run: npm test
      - run: npm run build

  # Parcours complet dans un vrai navigateur, sur le site construit comme en production
  # (mêmes en-têtes de sécurité que Caddy, CSP comprise).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forever
          POSTGRES_PASSWORD: forever
          POSTGRES_DB: forever_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forever" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_E2E: postgres://forever:forever@localhost:5432/forever_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # Dépendances livrées en production uniquement ; les outils de dev (esbuild, drizzle-kit) sont exclus.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image API
        uses: docker/build-push-action@v7
        with: { context: ., target: api, push: false, tags: forever-roster-api:ci }
      - name: Image bot
        uses: docker/build-push-action@v7
        with: { context: ., target: bot, push: false, tags: forever-roster-bot:ci }
      - name: Image web
        uses: docker/build-push-action@v7
        with: { context: ., target: web, push: false, tags: forever-roster-web:ci }
