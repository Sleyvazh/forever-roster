name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forever
          POSTGRES_PASSWORD: forever
          POSTGRES_DB: forever_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forever" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://forever:forever@localhost:5432/forever_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Dépendances livrées en production uniquement ; les outils de dev (esbuild, drizzle-kit) sont exclus.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image API
        uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, tags: forever-roster-api:ci }
      - name: Image web
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false, tags: forever-roster-web:ci }
