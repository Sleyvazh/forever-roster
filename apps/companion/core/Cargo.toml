[package]
name = "rc-core"
description = "Cœur de Roster Companion : sauvegarde de l'addon, données pour le jeu, dossiers de WoW, synchro avec le site."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
# TLS du système (SChannel sous Windows) : magasin de certificats et proxy de Windows, rien à compiler en C
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
